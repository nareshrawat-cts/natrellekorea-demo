<form class="warranty-status-form" novalidate>
  <span class="warranty-status-label">보증 상태조회</span>
  <div class="warranty-status-fields">
    <input type="text" name="name" class="warranty-status-input" title="이름 입력" placeholder="이름을 입력하세요." autocomplete="name">
    <input type="text" name="birth" class="warranty-status-input" maxlength="6" inputmode="numeric" title="생년월일 입력" placeholder="생년월일을 입력하세요." autocomplete="bday">
    <button type="submit" class="warranty-status-submit" aria-label="조회">
      <span class="warranty-status-icon" aria-hidden="true"></span>
    </button>
  </div>
</form>
